<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>GLM Lightning Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- GLM Monitor CSS -->
    <link rel="stylesheet" href="glm-monitor.css"/>
</head>
<body>
<div id="map"></div>

<div class="panel">
    <h1>GLM Lightning Monitor</h1>
    <div class="row">
        <label for="minutes">Show Last:</label>
        <input id="minutes" type="number" min="1" max="1440" value="30"/>
        <label>minutes</label>
    </div>
    <div class="row">
        <label for="auto"><input id="auto" type="checkbox" checked/> Auto-refresh</label>
        <label for="interval">every</label>
        <input id="interval" type="number" min="2" max="300" value="60"/>
        <label>sec</label>
        <button id="refresh" class="primary">Refresh Now</button>
    </div>
    <div class="row">
      <label for="rings"><input id="rings" type="checkbox" /> Show range rings</label>
      <label for="ringsMax">Max mi:</label>
      <input id="ringsMax" type="number" min="10" max="500" step="10" value="100" />
      <button id="ringsCenter" type="button" title="Pin rings to current map center">Center here</button>
    </div>
    <div class="row">
      <span id="ringsStatus" class="status"></span>
    </div>

    <div class="buttons">

    </div>
    <div id="status" class="status">Idle.</div>
</div>

<div class="legend">
    <div><strong>Flash Age</strong></div>
    <div class="scale" id="colorScale" title="Newest (red) → Oldest (blue)"></div>
    <div class="legend-row">
        <span>Newest</span>
        <span>Oldest</span>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- GLM Monitor JS -->
<script src="glm-monitor.js"></script>


</body>
</html>
