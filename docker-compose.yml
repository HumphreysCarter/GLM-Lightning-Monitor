name: GLM-Lightning-Monitor
services:
  glm-data-api:
    container_name: GLM-Data-API
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - API_PORT=${API_PORT:-8000}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - INGEST_BUCKET=${INGEST_BUCKET:-noaa-goes19}
      - INGEST_PREFIX=${INGEST_PREFIX:-GLM-L2-LCFA/}
      - INGEST_RECENT_HOURS=${INGEST_RECENT_HOURS:-6}
      - INGEST_MAX_FILES=${INGEST_MAX_FILES:-10}
      - INGEST_POLL_SEC=${INGEST_POLL_SEC:-60}
      - RETENTION_HOURS=${RETENTION_HOURS:-12}
    volumes:
      - glm_data:/app/data
      - ${LOCAL_DATA_PATH:-/dev/null}:/app/local_data:ro
    ports:
      - "${API_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 60s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  glm-monitor:
    container_name: GLM-Monitor
    image: nginx:1.27-alpine
    depends_on:
      - glm-data-api
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_PORT=${APP_PORT:-8000}
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 60s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  glm_data:
