name: GLM-Lightning-Monitor
services:
  glm-data-api:
    container_name: GLM-Data-API
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - UVICORN_WORKERS=2
      - INGEST_BUCKET=noaa-goes19
      - INGEST_PREFIX=GLM-L2-LCFA/
      - INGEST_RECENT_HOURS=6
      - INGEST_MAX_FILES=25
      - INGEST_POLL_SEC=60
      - RETENTION_HOURS=12
      - PYTHONUNBUFFERED=1
    volumes:
      - glm_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 60s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  glm-monitor:
    container_name: GLM-Monitor
    image: nginx:1.27-alpine
    depends_on:
      - glm-data-api
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 60s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  glm_data:
